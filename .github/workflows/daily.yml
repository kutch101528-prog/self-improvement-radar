# Runs the radar every day, saves the data to the repo, and publishes the dashboard as a website.
# Store the API key as an Actions secret named YT_API_KEY (never in code or config).
# For stricter supply-chain hygiene, pin each action to a full commit SHA.
name: daily-trend-radar
on:
  schedule:
    - cron: "30 1 * * *"   # 01:30 UTC daily (07:00 IST)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

concurrency:
  group: trend-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tracker
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python tracker.py

      - name: Build site folder
        run: |
          rm -rf site && mkdir -p site/archive
          cp dashboard.html site/index.html
          cp data/archive/*.html site/archive/ 2>/dev/null || true
          # Simple list of past days at /archive/
          {
            echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Past snapshots</title><body style="font-family:system-ui;max-width:640px;margin:40px auto;padding:0 16px"><h1>Past snapshots</h1><ul>'
            for f in $(ls site/archive | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.html$' | sort -r); do
              echo "<li><a href=\"$f\">${f%.html}</a></li>"
            done
            echo '</ul><p><a href="../">Back to today</a></p></body>'
          } > site/archive/index.html

      - name: Save results to the repo
        run: |
          git config user.name "trend-radar-bot"
          git config user.email "trend-radar-bot@users.noreply.github.com"
          git add data/ dashboard.html site/
          git commit -m "Daily update $(date -u +%F)" || echo "No changes"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishes to GitHub Pages. Delete this job if you host on Cloudflare Pages instead.
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
